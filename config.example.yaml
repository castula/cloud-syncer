# ==============================================================================
# Cloud File Syncer - 配置文件模板
# ==============================================================================

global:
  # 设备备注名称
  # 用于在日志和 Webhook 通知中识别当前服务器，留空则默认使用系统主机名。
  device_name: "HK-Node-01"
  
  # 随机延迟最大秒数
  # 每次执行前随机等待 0 到该数值之间的秒数（0 表示不延迟）。
  # 用于打散多台 VPS 同时请求云端服务器的并发压力。
  jitter_max: 15
  
  # --------------------------------------------------------------------------
  # 全局异常自动回滚总开关 (true / false)
  # 说明：此项为全局默认值。如果子任务未单独设置，则自动继承此处；若子任务中
  #      显式设置了该字段，则以子任务内的设置为准。
  # --------------------------------------------------------------------------
  rollback_on_failure: true
  
  # 备份文件夹定期清理周期
  # 当开启回滚机制时，自动清空 /backups 备份文件夹的 Cron 表达式。
  # 示例表示每 3 天的凌晨 4 点清空一次，留空则代表不自动清理。
  backup_clean_cron: "0 4 */3 * *"
  
  # Webhook 通知设置
  # 支持通用 JSON 接口、飞书、钉钉、企业微信、Bark、Telegram 等。
  webhook:
    url: ""
    # 通知触发级别: 
    #   "all"        - 更新成功或发生异常回滚时均发送通知
    #   "error_only" - 仅在校验失败、动作异常或触发回滚时发送告警（推荐多节点防刷屏使用）
    notify_on: "all"
    # 自定义请求头（可选，部分自建接口可能需要 Token 鉴权）
    secret_header: ""

# ==============================================================================
# 同步任务列表 (Tasks)
# 初次生成时默认为空，请根据实际需求取消下方任务示例的注释并按需修改。
# ==============================================================================
tasks: []

