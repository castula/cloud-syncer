name: Manual Build and Push

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloud-syncer:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-syncer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete untagged images from GHCR
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          package_name: cloud-syncer
          untagged_only: true
          owner_type: ${{ github.event.repository.owner.type == 'Organization' && 'org' || 'user' }}

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "✅ Cloud Syncer 手动构建并推送成功"
          echo ""
          echo "🏷️ 推送标签:"
          echo "  - ghcr.io/${{ github.repository_owner }}/cloud-syncer:latest"
          echo "  - docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloud-syncer:latest"
          echo "=========================================="

  cleanup:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Cleanup old workflow runs (keep last 3)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs \
          --paginate \
          --jq '.workflow_runs | sort_by(.created_at) | reverse | .[3:] | .[].id' | \
          while read run_id;
          do
            echo "Deleting workflow run $run_id"
            gh api \
            repos/${{ github.repository }}/actions/runs/$run_id \
            -X DELETE
          done
